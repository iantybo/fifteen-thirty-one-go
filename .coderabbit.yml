# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: >
  -  Serious, clear, precise language only. When giving suggestions, indicate if the code is in the path that would cause a production outage or not.

early_access: true
enable_free_tier: true
inheritance: true

reviews:
  profile: assertive # more nit-picky

  high_level_summary_instructions: >-
    The top line should say: 'Risk Score:' followed by either 'Extremely Low -
    Auto-merge', 'Low - Address Requested Changes', 'Medium - Human Review
    Required', or 'High - Escalation Required' depending on the complexity and
    risk of the change. In the high level summary, give a description of the
    langauges used, the frameworks and code patterns used, and then a brief
    description in 50 words or less.

  auto_title_placeholder: '[cr]'
  auto_title_instructions: Follow conventional commits https://www.conventionalcommits.org/en/v1.0.0/

  path_instructions:
    - path: '**/*'
      instructions: >
        - All code should only be related to serving the Cribbage game
        - All code in production must either be Go or Typescript, admin code like Dockerfiles and Makefiles is fine
        - Ensure all code is not committing n+1 queries, O(n^2), and other recursive/iterative traps
        - No overly clever abstractions
        - Address any SonarQube findings in a new PR/MR
        - Ensure functions are focused and not doing too much UNLESS detailed comments are added
        - Ensure no business logic is tightly coupled to any particular framework
        - Ensure no errors are swallowed, and no silents failures take place
        - No fire-and-forget async processes

        # MCP Settings

        ## MCP Notify — Mandatory Tracking (scratchpad required)

        Before posting this review, you MUST complete the following scratchpad and call
        the MCP tool `notify` for every finding and for the overall PR risk score.

        ### Step 1 — Fill the scratchpad

        <!-- [notify_scratchpad]
        Overall risk score : [ ] recorded — value: ___
        Findings collected :
          - [ ] <finding 1 description> | risk: ___
          - [ ] <finding 2 description> | risk: ___
          (add one line per finding)
        notify calls issued:
          - [ ] overall risk score
          - [ ] finding 1
          - [ ] finding 2
          (one checkbox per call; tick only after the call succeeds)
        [notify_scratchpad_end] -->

        ### Step 2 — Call `notify` for each finding

        For every finding identified, call the MCP tool `notify` with:
        - `finding_description`: the full finding text
        - `risk_score`: severity of that individual finding (low / medium / high / critical)
        - `source`: "coderabbit"
        - `url`: the permalink to the file or line being flagged

        ### Step 3 — Call `notify` for the overall PR risk score

        After all per-finding calls, call `notify` once more with:
        - `finding_description`: "Overall PR risk assessment: <one-sentence summary>"
        - `risk_score`: the aggregate PR risk level
        - `source`: "coderabbit"
        - `url`: the pull request URL

        ### Step 4 — Verify before posting

        Do NOT post the review until every checkbox in the scratchpad above is ticked.
        If any `notify` call fails, log the failure in the scratchpad and retry once
        before proceeding. Post if any MCP tool calls fail in as an issue.

        - Use MCP tool `notify` to send structured review events.
        - Call `notify` once for the final risk score.
        - Call `notify` once for each finding you emit.
        - Use exactly these argument shapes:
          - Risk score: {"event_type":"risk_score","timestamp":"<ISO-8601>","source":"coderabbit","url":"<PR URL>","risk_score":"<one of: Extremely Low - Auto-merge | Low - Address Requested Changes | Medium - Human Review Required | High - Escalation Required>"}
          - Finding: {"event_type":"finding","timestamp":"<ISO-8601>","source":"coderabbit","url":"<PR URL>","finding":"<concise summary, max 500 chars>"}
        - Do not wrap arguments in markdown or send raw prose.
        - If the tool returns an error, read the error message and retry with corrected arguments.

    - path: '**/*.go'
      instructions: >
        - Use proper error handling with error wrapping using fmt.Errorf with %w verb
        - Ensure all public functions have godoc comments
        - Follow Go naming conventions (exported names start with capital letter)
        - Use context.Context for cancellation and timeouts in long-running operations
        - Prefer explicit error returns over panic
        - Use defer for cleanup operations
        - Validate input parameters and return descriptive errors
        - Consider concurrency safety for shared state

    - path: '**/*.{ts,tsx}'
      instructions: >
        - Review the TypeScript code for conformity with the Google TypeScript style guide, highlighting any deviations.
        - Review the Typescript and React code for conformity with best practices in React, Recoil, Graphql, and Typescript. Highlight any deviations.

  pre_merge_checks:
    # Enforce pre-merge checks cannot be dismissed by PR author
    override_requested_reviewers_only: true

    # Custom checks defined by maintainers that code quality must meet before merge
    custom_checks:
      - mode: error
        name: Linked JIRA ticket meets criteria
        instructions: >-
          Make sure there is a Jira ticket linked in the PR/MR AND that it
          satisfies the text of that JIRA ticket

      - mode: error
        name: Ensure no "exec" type commands run
        instructions: >-
          Make sure no tools wrap external shell scripts and bash commands,
          e.g., a Python script cannot invoke a bash command, nor can a
          Terraform file run the "exec" command. Scan all the code to ensure
          that external commands are not hidden.

      - mode: error
        name: GDPR and PII Data Protection Compliance
        instructions: >-
          Carefully scan all code for GDPR violations and improper handling of
          Personally Identifiable Information (PII). This is a BLOCKING check -
          any violation must prevent merge. Check for:

          1. PII Data Transmission: Ensure no PII fields (mothers_maiden_name,
          billing_address, phone_number,
             date_of_birth, annual_income, email, address, full_name) are being transmitted via WebSocket broadcasts,
             public APIs, logs, or any mechanism that exposes them to unauthorized parties (other users, analytics systems,
             third-party services).

          2. Logging Violations: Verify that PII is NEVER logged in plaintext.
          Check all log statements (log.Printf,
             console.log, etc.) to ensure they do not include sensitive fields. Structured logging of user IDs is acceptable,
             but never log actual PII values.

          3. Data Minimization: Confirm that database queries only SELECT the
          minimum fields necessary for the operation.
             If a function needs username and games_played, it should NOT query annual_income or other unnecessary PII fields.

          4. Consent and Purpose Limitation: Flag any code that collects or
          processes PII without a clear, legitimate purpose
             directly related to core functionality. Income data collection for a card game is highly suspicious unless
             explicitly required for payment processing.

          5. Cross-User Data Exposure: Ensure User A's PII is never visible to
          User B. Check all broadcast/multicast
             mechanisms (WebSocket rooms, pub/sub, cache entries) to verify they don't leak PII across user boundaries.

          6. API Response Sanitization: Verify that API responses and WebSocket
          messages properly filter out PII fields
             before sending to clients. Use allowlists (explicit safe fields) rather than denylists.

          7. Frontend Storage: Check that frontend code doesn't store PII in
          localStorage, sessionStorage, or cookies
             (except for properly secured httpOnly authentication cookies).

          If ANY of these violations are found, mark this check as FAILED and
          describe the specific violation with file path and line numbers. The
          PR cannot be merged until all violations are resolved.

      - mode: warning
        name: Enforce Feature Flag
        instructions: >-
          FAIL if a PR introduces or modifies production application logic and
          the new behavior is not guarded by a feature flag. PASS only if: 1)
          Each new behavior branch is conditionally gated by an existing or
          newly added feature flag, and 2) The PR includes the flag
          identifier(s) in code or PR description. Exempt files: Makefile,
          Dockerfile, *.md, CI/workflow config, and other non-runtime
          tooling/config files.

    # Pre-configured pre-merge checks
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: error
      requirements: >
        - Title must either be auto-generated by CodeRabbit or have a ticket linked and give an accurate description of where and what the changes encompass
        - Title must not contain emojis and non-ASCII characters
    description:
      mode: warning
    issue_assessment:
      mode: error

  # Call out any obvious AI slop
  slop_detection:
    enabled: true

  auto_review:
    enabled: true
    description_keyword: ''
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
    ignore_usernames: []

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false
    custom:
      - enabled: true
        name: Infosec Test
        instructions: |
          - Run a battery of appsec related scans against this branch

      - enabled: true
        name: MCP Notify
        instructions: |
          # MCP Settings
          - Use MCP tool `notify` to send structured review events.
          - Call `notify` once for the final risk score.
          - Call `notify` once for each finding you emit.
          - Use exactly these argument shapes:
            - Risk score: {"event_type":"risk_score","timestamp":"<ISO-8601>","source":"coderabbit","url":"<PR URL>","risk_score":"<one of: Extremely Low - Auto-merge | Low - Address Requested Changes | Medium - Human Review Required | High - Escalation Required>"}
            - Finding: {"event_type":"finding","timestamp":"<ISO-8601>","source":"coderabbit","url":"<PR URL>","finding":"<concise summary, max 500 chars>"}
          - Do not wrap arguments in markdown or send raw prose.
          - If the tool returns an error, read the error message and retry with corrected arguments.

      - enabled: true
        name: Fixall
        instructions: |
          - Address most recent pipeline failres and findings in a new PR/MR

  # Review behavior settings
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  high_level_summary: true
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions: []
  auto_apply_labels: true
  suggested_reviewers: true
  auto_assign_reviewers: true
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters: []

  # Make CodeRabbit block merges until all issues are resolved
  request_changes_workflow: true
  abort_on_close: true

