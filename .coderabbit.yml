# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: >
  - Serious, clear, precise language only. When giving suggestions, indicate if the code is in the path that would cause a production outage or not.
  - Follow conventional comments: https://conventionalcomments.org/

early_access: true
enable_free_tier: true
inheritance: true

# Configuration for CodeRabbit context sources
knowledge_base:
  mcp:
    usage: enabled
    disabled_servers: []
  linked_repositories:
    - repository: iantype/fifteen-thirty-one-go-utils
      instructions: >-
        - Treat pkg/runtimeinterop.ScoreFromCodes as a strict cross-repo contract.
        - Validate runtime card encoding matches utils parser exactly: ten MUST be "10"
          (not "T"), and the full code format must remain rank+suit (e.g. AS, 10H, KD).
        - Flag any runtime mapper or serialization changes that alter inputs sent to
          fifteen-thirty-one-go-utils scoring APIs.
        - Reject silent fallbacks on interop parse/scoring errors; runtime must emit explicit
          errors instead of returning zero-value score breakdowns.
        - Require or update parity tests that include ten cards, nobs, crib flush rules,
          and malformed input cases to catch cross-repo drift.
  code_guidelines:
    enabled: true
    filePatterns:
      - docs/FRONTEND-DESIGN-GUIDE.md
      - docs/infosec/SECURITY-*.md
      - agents/*AGENT*.md
  web_search:
    enabled: true
  learnings:
    scope: global
  issues:
    scope: global
  jira:
    usage: enabled
    project_keys: []
  linear:
    usage: enabled
    team_keys: []
  pull_requests:
    scope: global


reviews:
  profile: assertive # more nit-picky

  suggested_reviewers_instructions:
    - reviewers:
        - handle: iantype
          type: user
      instructions: Assign 'Medium - Human Review Required', or 'High - Escalation Required' reviews to this user

  high_level_summary_instructions: >-
    The top line should say: 'Risk Score:' followed by either 'Extremely Low -
    Auto-merge', 'Low - Address Requested Changes', 'Medium - Human Review
    Required', or 'High - Escalation Required' depending on the complexity and
    risk of the change. In the high level summary, give a description of the
    langauges used, the frameworks and code patterns used, and then a brief
    description in 50 words or less.

  auto_title_placeholder: '[cr]'
  auto_title_instructions: Follow conventional commits https://www.conventionalcommits.org/en/v1.0.0/

  path_instructions:
    - path: '**/*'
      instructions: >
        - All code should only be related to serving the Cribbage game
        - All code in production must either be Go or Typescript, admin code like Dockerfiles and Makefiles is fine
        - Address any SonarQube findings in a new PR/MR
        - Ensure functions are focused and not doing too much UNLESS detailed comments are added
        - Ensure no business logic is tightly coupled to any particular framework
        - Ensure no errors are swallowed, and no silents failures take place
        - No fire-and-forget async processes

    - path: '**/*.go'
      instructions: >
        - Use proper error handling with error wrapping using fmt.Errorf with %w verb
        - Ensure all public functions have godoc comments
        - Follow Go naming conventions (exported names start with capital letter)
        - Use context.Context for cancellation and timeouts in long-running operations
        - Prefer explicit error returns over panic
        - Use defer for cleanup operations
        - Validate input parameters and return descriptive errors
        - Consider concurrency safety for shared state

    - path: '**/*.{ts,tsx}'
      instructions: >
        - Review the TypeScript code for conformity with the Google TypeScript style guide, highlighting any deviations.
        - Review the Typescript and React code for conformity with best practices in React, Recoil, Graphql, and Typescript. Highlight any deviations.

  pre_merge_checks:
    # Enforce pre-merge checks cannot be dismissed by PR author
    override_requested_reviewers_only: true

    # Custom checks defined by maintainers that code quality must meet before merge
    custom_checks:
      - mode: error
        name: Ensure no "exec" type commands run
        instructions: >-
          Make sure no tools wrap external shell scripts and bash commands,
          e.g., a Python script cannot invoke a bash command, nor can a
          Terraform file run the "exec" command. Scan all the code to ensure
          that external commands are not hidden.

      - mode: error
        name: Performance and Algorithmic Complexity Review
        instructions: >
          - Carefully review this code for performance regressions, unnecessary algorithmic complexity, and hot-path inefficiencies.
          - This is a BLOCKING check: any significant issue that could materially degrade latency, throughput, or resource usage must prevent merge.
          - Flag O(n^2), O(n^3), or worse behavior when input sizes may be non-trivial, especially in request handlers, background jobs, rendering paths, or loops over collections.
          - Flag hidden nested work inside loops, including repeated scans, filtering, sorting, serialization, regex compilation, JSON parsing, DB lookups, HTTP calls, DOM queries, or recomputation of invariant values.
          - Detect N+1 query patterns and require batching, joins, preloading, or set-based retrieval where appropriate.
          - Flag repeated recalculation of deterministic values in hot paths when caching, memoization, precomputation, or moving work outside the loop would be appropriate.
          - Flag inefficient data structure choices, such as linear membership checks on arrays when sets/maps are more appropriate, repeated copying, repeated concatenation, or frequent front insertions.
          - Flag unbounded growth, memory leaks, retained listeners/subscriptions, accumulating buffers, or caches without eviction or cleanup.
          - Flag avoidable allocation churn in hot paths, including repeated object creation, string building, cloning, intermediate arrays, or conversions that increase GC pressure.
          - Flag repeated sorting or repeated full passes over large collections when a single pass, indexing, partial selection, or precomputation would suffice.
          - Flag recursive implementations that risk excessive recomputation, poor asymptotic behavior, or stack overflows when iterative or memoized approaches are safer.
          - Flag over-fetching or over-processing when code retrieves, deserializes, or processes more data than necessary.
          - Flag expensive synchronous work in critical paths, including compression, encryption, hashing, parsing, template rendering, logging, analytics, or debug-only work that should be deferred, sampled, batched, or removed.
          - Flag missing guardrails such as pagination, size limits, timeouts, concurrency limits, backpressure, or batching for large or adversarial inputs.
          - In frontend code, flag unnecessary rerenders, repeated expensive selectors, large list rendering without virtualization, unstable memoization dependencies, or recomputation during render.
          - Treat nominally linear work as blocking when it is performed at high frequency, on large inputs, or redundantly across many calls such that caching, indexing, batching, or memoization is clearly warranted.
          - Flag process problems that generate excessive intermediate structures, duplicate traversals, discard reusable results, or turn simple iterative work into unnecessarily expensive recursive or tree-recursive work.
          - Ignore micro-optimizations and speculative concerns.
          - Only report meaningful, merge-blocking performance issues.
          - For each issue, include file path, line numbers, the concrete performance risk, the expected complexity or scaling problem, and the fix category.
          - If no material performance risks are found, mark this check as PASSED and remain brief.

      - mode: error
        name: GDPR and PII Data Protection Compliance
        instructions: >
          - Carefully scan all code for GDPR violations and improper handling of Personally Identifiable Information (PII).
          - This is a BLOCKING check: any violation must prevent merge.
          - Ensure no PII fields such as mothers_maiden_name, billing_address, phone_number, date_of_birth, annual_income, email, address, or full_name are transmitted via WebSocket broadcasts, public APIs, logs, analytics, or third-party services without authorization.
          - Verify that PII is never logged in plaintext. User IDs may be acceptable, but actual PII values must not appear in logs.
          - Confirm that database queries select only the minimum fields necessary for the operation and do not retrieve unrelated PII.
          - Flag any collection or processing of PII without a clear and legitimate purpose directly related to core functionality.
          - Ensure User A’s PII is never visible to User B through API responses, broadcasts, pub/sub systems, cache entries, or shared channels.
          - Verify that API responses and WebSocket messages use allowlists of safe fields rather than denylists to prevent PII leakage.
          - Ensure frontend code does not store PII in localStorage, sessionStorage, or cookies, except properly secured httpOnly authentication cookies where appropriate.
          - If any violation is found, mark this check as FAILED and describe the specific issue with file path and line numbers.
          - The MR cannot be merged until all violationare resolved.


      - mode: warning
        name: Enforce Feature Flag
        instructions: >-
          FAIL if a PR introduces or modifies production application logic and
          the new behavior is not guarded by a feature flag. PASS only if: 1)
          Each new behavior branch is conditionally gated by an existing or
          newly added feature flag, and 2) The PR includes the flag
          identifier(s) in code or PR description. Exempt files: Makefile,
          Dockerfile, *.md, CI/workflow config, and other non-runtime
          tooling/config files.

    # Pre-configured pre-merge checks
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: error
      requirements: >
        - Title must either be auto-generated by CodeRabbit or have a ticket linked and give an accurate description of where and what the changes encompass
        - Title must not contain emojis and non-ASCII characters
    description:
      mode: warning
    issue_assessment:
      mode: error

  # Call out any obvious AI slop
  slop_detection:
    enabled: true

  auto_review:
    enabled: true
    description_keyword: ''
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
    ignore_usernames: []

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false
    custom:
      - enabled: true
        name: Infosec Test
        instructions: |
          - Run a battery of appsec related scans against this branch

      - enabled: true
        name: Fixall
        instructions: |
          - Address most recent pipeline failres and findings in a new PR/MR

  # Review behavior settings
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  high_level_summary: true
  review_status: true
  review_details: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  labeling_instructions: []
  auto_apply_labels: true
  suggested_reviewers: true
  auto_assign_reviewers: true
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters: []

  # Make CodeRabbit block merges until all issues are resolved
  request_changes_workflow: true
  abort_on_close: true

  tools:
    ast-grep:
      rule_dirs: []
      util_dirs: []
      essential_rules: true
      packages: []
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules: []
      enabled_categories: []
      disabled_categories: []
      enabled_only: false
      level: default
    biome:
      enabled: true
    hadolint:
      enabled: true
    swiftlint:
      enabled: true
    phpstan:
      enabled: true
      level: default
    phpmd:
      enabled: true
    phpcs:
      enabled: true
    golangci-lint:
      enabled: true
